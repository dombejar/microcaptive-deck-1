<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FAQs · 831(b) Micro Captive · Pomeroy Group</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/microcaptive-deck-1/shared.css">

<style>
/* ── Design tokens (verbatim from build-deck-v5.py) ───────────────────── */
:root {
  --navy:        #0E1B3D;
  --navy-dim:    #1F2C50;
  --navy-bg:     #EEF1F7;
  --text:        #111827;
  --text-mute:   #4B5563;
  --text-dim:    #9CA3AF;
  --white:       #FFFFFF;
  --border:      #E5E7EB;
  --border-2:    #D1D5DB;
  --rule:        #D6DBE3;
  --bg-soft:     #F7F8FA;
  --gold:        #B08D3D;
  --gold-dim:    #8C6F2D;
  --gold-bg:     #F8F4EC;
  --gold-line:   rgba(176, 141, 61, 0.30);

  /* r9 chassis: harmless on utility pages (scale transform not applied) */
  --slide-w: 1280;
  --slide-h: 680;
  --scale: 1;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

html, body {
  height: 100svh;
  margin: 0;
  overflow: hidden;          /* page itself never scrolls — only the middle pane */
}
@supports not (height: 100svh) {
  html, body { height: 100vh; }
}

body {
  background: var(--white);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

h1, h2, h3, h4, .display {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: -0.01em;
  line-height: 1.2;
}

a { color: var(--gold-dim); text-decoration: none; }
a:hover { color: var(--gold); }
::selection { background: var(--gold-bg); color: var(--text); }

/* ── Brand bar ────────────────────────────────────────────────────────── */
/* Desktop-base top-bar chassis (.brandbar, .brand-left, .brand-nav box,
   .brand-nav a/.current padding+border, :hover, .sep) now comes from
   /shared.css — the single source of truth that keeps the bar pixel-identical
   across all 16 pages. Only the rules shared.css does NOT cover are kept here:
     - .brand-left .dot  (separator glyph; not in shared.css)
     - .brand-nav base box props beyond font-size/gap (display/align-items/
       font-weight/letter-spacing/text-transform — shared.css only sets
       font-size + gap)
     - .brand-nav a color + transition (shared.css sets neither) */
.brand-left .dot { color: var(--gold-dim); margin: 0 6px; }
.brand-nav {
  display: flex;
  align-items: center;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.brand-nav a, .brand-nav .current { transition: color 0.18s; }
.brand-nav a { color: var(--text-dim); }

/* ── Slide pane (utility variant: internal scroll, no fixed stage) ──── */
.slide-pane {
  /* display:block restores the original block flow: shared.css's .slide-pane is
     display:flex (fixed-stage centering) which this scroll-pane page must NOT use. */
  display: block;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--border-2) transparent;
}
.slide-pane::-webkit-scrollbar { width: 8px; }
.slide-pane::-webkit-scrollbar-track { background: transparent; }
.slide-pane::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

/* ── Hero block ──────────────────────────────────────────────────────── */
.hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: 88px clamp(20px, 5vw, 64px) 32px;
}
.hero h1 {
  font-size: clamp(44px, 7vw, 84px);
  margin-bottom: 18px;
  letter-spacing: -0.02em;
}
.hero h1 .accent {
  font-style: italic;
  color: var(--gold-dim);
  font-weight: 500;
}
.hero .lede {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(19px, 2.2vw, 24px);
  line-height: 1.4;
  color: var(--gold-dim);
  margin-bottom: 18px;
  max-width: 72ch;
}
.hero .helper {
  font-size: 13px;
  color: var(--text-mute);
  letter-spacing: 0.04em;
  margin-top: 8px;
}

/* ── Category accordion (outer level) ────────────────────────────────── */
.category-wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 clamp(20px, 5vw, 64px);
}
.category-row {
  border-top: 1px solid var(--gold-line);
}
.category-row:last-of-type {
  border-bottom: 1px solid var(--gold-line);
  margin-bottom: 88px;
}
.category-head {
  width: 100%;
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color: inherit;
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 28px 0;
  transition: opacity 0.18s;
}
.category-head:hover { opacity: 0.78; }
.category-head:focus-visible {
  outline: 2px solid var(--gold-dim);
  outline-offset: 4px;
}
.category-head .c-num {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 18px;
  color: var(--gold-dim);
  flex-shrink: 0;
  min-width: 28px;
}
.category-head .c-title {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--navy);
}
.category-head .c-rule {
  flex: 1;
  height: 1px;
  background: var(--gold-line);
  align-self: center;
}
.category-head .c-icon {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 20px;
  color: var(--gold-dim);
  flex-shrink: 0;
  width: 16px;
  text-align: center;
  align-self: center;
}

.category-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.32s ease-out;
}
.category-row.open .category-body {
  /* set inline via JS, then released to none after transition */
}

/* ── FAQ accordion (inner level) ─────────────────────────────────────── */
.faq-list {
  border-top: 1px solid var(--border);
  margin-bottom: 8px;
}
.faq-row {
  border-bottom: 1px solid var(--border);
  position: relative;
}
.faq-row::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--gold-dim);
  opacity: 0;
  transition: opacity 0.18s;
}
.faq-row.open::before,
.faq-row:hover::before { opacity: 1; }

.faq-q {
  width: 100%;
  background: none;
  border: 0;
  padding: 20px 24px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color: inherit;
  transition: background 0.18s;
}
.faq-q:hover { background: var(--bg-soft); }
.faq-q:focus-visible {
  outline: 2px solid var(--gold-dim);
  outline-offset: -2px;
}
.faq-q-text {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 600;
  font-size: 19px;
  line-height: 1.3;
  color: var(--navy);
  letter-spacing: -0.005em;
  flex: 1;
}
.faq-q-icon {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 20px;
  color: var(--gold-dim);
  flex-shrink: 0;
  line-height: 1.3;
  margin-top: 2px;
  width: 16px;
  text-align: center;
}

.faq-a {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.28s ease-out;
}
.faq-row.open .faq-a {
  max-height: 3000px;
}
.faq-a-body {
  padding: 0 24px 24px;
  font-size: 16px;
  color: var(--text);
  line-height: 1.7;
  max-width: 72ch;
}
.faq-a-body p { margin-bottom: 14px; }
.faq-a-body p:last-child { margin-bottom: 0; }
.faq-a-body strong {
  font-family: 'Playfair Display', serif;
  font-weight: 600;
  font-style: italic;
  color: var(--navy);
}
.faq-a-body .placeholder {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-dim);
  background: var(--gold-bg);
  padding: 3px 8px;
  border-radius: 2px;
}
.faq-a-body a.placeholder-link {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-dim);
  background: var(--gold-bg);
  padding: 4px 12px;
  border-radius: 2px;
  border: 1px solid var(--gold-line);
  transition: background 0.18s, border-color 0.18s, color 0.18s;
  text-decoration: none;
}
.faq-a-body a.placeholder-link:hover {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--white);
}

/* ── Footer ──────────────────────────────────────────────────────────── */
/* ── Scroll cue (hero hint) ────────────────────────────────────────── */
.scroll-cue {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--gold-dim);
  margin-top: clamp(16px, 2vh, 28px);
  text-align: center;
}
.scroll-cue .arrow {
  display: inline-block;
  font-style: normal;
  animation: scroll-bounce 1.8s ease-in-out infinite;
}
@keyframes scroll-bounce {
  0%, 100% { transform: translateY(0); opacity: 0.7; }
  50%      { transform: translateY(4px); opacity: 1; }
}

/* ── Deck nav (replaces text footer) ─────────────────────────────── */
.deck-nav {
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: minmax(110px, 1fr) minmax(0, auto) minmax(110px, 1fr);
  background: var(--bg-soft);
  line-height: 1.5;
}
.deck-nav > * + * { border-left: 1px solid var(--border); }
.deck-nav-link {
  padding: 10px clamp(20px, 5vw, 48px);
  text-decoration: none;
  display: flex;
  flex-direction: column;
  gap: 2px;
  justify-content: center;
  transition: background .15s;
  min-width: 0;
}
.deck-nav-mid {
  font-family: 'Inter', sans-serif;
  font-size: 14.5px;
  color: var(--text-mute);
  letter-spacing: 0.04em;
  padding: 10px 16px;
  white-space: nowrap;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  overflow: hidden;
}
.deck-nav-mid a { color: var(--gold-dim); }
.deck-nav-mid a:hover { color: var(--gold); }
.deck-nav-mid .dot { color: var(--gold-dim); margin: 0 8px; }
.deck-nav-link:hover { background: var(--white); }
.deck-nav-link.next { text-align: right; align-items: flex-end; }
.deck-nav .dn-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-dim);
}
.deck-nav .dn-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(15px, 1.8vw, 18px);
  color: var(--navy);
  font-weight: 600;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Deck nav mobile: hide contact strip, split Prev/Next ───────────── */
@media (max-width: 640px) {
  .deck-nav-mid { display: none; }
  .deck-nav { grid-template-columns: 1fr 1fr; }
}

/* ── Responsive tweaks ──────────────────────────────────────────────── */
@media (max-width: 720px) {
  .hero { padding-top: 56px; }
  .category-head { padding: 22px 0; }
  .category-head .c-title { font-size: 12px; letter-spacing: 0.2em; }
  .faq-q { padding: 18px 18px; }
  .faq-q-text { font-size: 17px; }
  .faq-a-body { padding: 0 18px 20px; }
}

/* ── Mobile: full phone-readable layout ─────────────────────────────── */
@media (max-width: 768px) {
  /* Prevent any horizontal overflow at the body / html level */
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }

  /* ── Brand bar: single compact row ── */
  .brandbar {
    padding: 8px 14px !important;
    flex-wrap: nowrap !important;
    gap: 0 !important;
    align-items: center !important;
  }
  .brand-left {
    display: none !important;
  }
  .brand-nav {
    flex-wrap: nowrap !important;
    gap: 0 !important;
    font-size: 9px !important;
    letter-spacing: 0.10em !important;
    justify-content: center !important;
    width: 100% !important;
  }
  .brand-nav a, .brand-nav .current {
    white-space: nowrap;
  }
  .brand-nav .sep {
    margin: 0 8px !important;
    flex-shrink: 0;
  }

  /* ── Hero: comfortable padding + wrapping ── */
  .hero {
    padding: 40px 16px 24px;
  }
  .hero h1 {
    font-size: clamp(32px, 8vw, 48px);
    margin-bottom: 12px;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .hero .lede {
    font-size: clamp(16px, 4vw, 20px);
    overflow-wrap: break-word;
  }
  .hero .helper {
    font-size: 12px;
  }

  /* ── Category wrapper: tighter horizontal padding ── */
  .category-wrap {
    padding: 0 16px;
  }
  .category-head {
    padding: 18px 0;
    gap: 12px;
  }
  .category-head .c-num {
    font-size: 16px;
    min-width: 24px;
  }
  .category-head .c-title {
    font-size: 11px;
    letter-spacing: 0.16em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  /* Hide the decorative horizontal rule inside category header to save space */
  .category-head .c-rule {
    display: none;
  }

  /* ── FAQ questions: full-width, no overflow ── */
  .faq-q {
    padding: 16px 12px;
    gap: 12px;
  }
  .faq-q-text {
    font-size: 15px;
    line-height: 1.35;
    overflow-wrap: break-word;
    word-break: break-word;
    min-width: 0;
  }
  .faq-q-icon {
    flex-shrink: 0;
    font-size: 18px;
  }

  /* ── FAQ answers: full-width, readable type ── */
  .faq-a-body {
    padding: 0 12px 18px;
    font-size: 15px;
    line-height: 1.65;
    max-width: 100%;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .faq-a-body p {
    margin-bottom: 12px;
  }

  /* ── Deck nav: canonical portrait compaction (matches why) ── */
  .deck-nav {
    max-width: 100% !important;
    overflow: hidden !important;
  }
  .deck-nav-link {
    padding: 6px 14px !important;
    min-width: 0 !important;
  }
  .deck-nav .dn-title {
    font-size: clamp(11px, 3vw, 13px) !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
  }
  .deck-nav .dn-label {
    font-size: 9px !important;
  }
}

/* ── Landscape phone (e.g. 844×390, 667×375) ────────────────────────── */
/* AC9: consumes shared landscape tokens from shared.css; no hardcoded
   one-off sizes. AC8: safe-area insets on .slide-pane. AC7: viewport
   meta above carries viewport-fit=cover. Internal scroll is the
   accepted exception for this long-form FAQ utility page. */
@media (orientation: landscape) and (max-height: 500px) {

  /* ── Canonical chassis (mirrors deck slides) ── */
  html, body { height: 100svh !important; overflow: hidden !important; }
  body { display: grid !important; grid-template-rows: auto minmax(0, 1fr) auto !important; }

  /* top bar: compact, height-token, centered nav, no brand-left */
  .brandbar {
    height: var(--landscape-brandbar-h) !important;
    padding: 0 16px !important;
    flex-wrap: nowrap !important;
    align-items: center !important;
    overflow: hidden !important;
  }
  .brand-left { display: none !important; }
  .brand-nav {
    flex-wrap: nowrap !important;
    gap: 0 !important;
    font-size: 9px !important;
    letter-spacing: 0.10em !important;
    justify-content: center !important;
    width: 100% !important;
  }
  .brand-nav a, .brand-nav .current { white-space: nowrap; }
  .brand-nav .sep { margin: 0 8px !important; flex-shrink: 0; }

  /* bottom bar: 2-col prev/next, no mid strip — matches all deck slides */
  .deck-nav {
    max-width: 100% !important;
    overflow: hidden !important;
    grid-template-columns: 1fr 1fr !important;
  }
  .deck-nav-mid { display: none !important; }
  .deck-nav-link { padding: 3px 14px !important; min-width: 0 !important; }
  .deck-nav .dn-label { font-size: 9px !important; line-height: 1 !important; }
  .deck-nav .dn-title {
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    font-size: clamp(11px, 2.4vw, 14px) !important;
    line-height: 1.2 !important;
  }

  /* slide-pane: scrollable for long-form content + safe-area insets (AC8) */
  .slide-pane {
    overflow-y: auto !important;
    overflow-x: hidden !important;
    padding-inline: max(var(--landscape-pane-pad-inline),
                        env(safe-area-inset-left),
                        env(safe-area-inset-right)) !important;
    /* Left gutter for the fixed back-to-deck arrow (env + 46px, additive) so
       the 40px landscape arrow never overlaps the category list (nav R2). */
    padding-left: calc(env(safe-area-inset-left) + 46px) !important;
    padding-top: max(0px, env(safe-area-inset-top)) !important;
  }

  /* hero: tighter padding, tokens for type sizes */
  .hero {
    padding: 16px 16px 12px !important;
  }
  .hero h1 {
    font-size: var(--landscape-h1) !important;
    margin-bottom: 6px !important;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .hero .lede {
    font-size: var(--landscape-h2) !important;
    margin-bottom: 6px !important;
    overflow-wrap: break-word;
  }
  /* helper hint + scroll-cue are redundant in landscape (categories immediately
     visible); hide them to save vertical space and avoid sub-14px font readings */
  .hero .helper { display: none !important; }
  .scroll-cue   { display: none !important; }

  /* category + faq: tighter horizontal padding, no overflow */
  .category-wrap { padding: 0 14px !important; }
  .category-head { padding: 12px 0 !important; gap: 10px !important; }
  .category-head .c-num { font-size: 15px !important; min-width: 22px !important; }
  .category-head .c-title {
    font-size: var(--landscape-body) !important;  /* 14px — meets body floor; was 10px */
    letter-spacing: 0.14em !important;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .category-head .c-rule { display: none !important; }

  /* last category: breathing room before the deck-nav */
  .category-row:last-of-type { margin-bottom: 16px !important; }

  .faq-q { padding: 14px 10px !important; gap: 10px !important; }
  .faq-q-text {
    font-size: var(--landscape-body) !important;  /* 14px — body floor */
    line-height: 1.3 !important;
    overflow-wrap: break-word;
    word-break: break-word;
    min-width: 0;
  }
  .faq-q-icon { flex-shrink: 0 !important; font-size: 16px !important; }
  .faq-a-body {
    padding: 0 10px 14px !important;
    font-size: var(--landscape-body) !important;  /* 14px — was 13px (bug fix) */
    line-height: 1.6 !important;
    max-width: 100% !important;
    overflow-wrap: break-word;
    word-break: break-word;
  }
}
</style>
</head>
<body>

<!-- ── Brand bar ───────────────────────────────────────────────────── -->
<header class="brandbar">
  <a class="brand-left" href="/microcaptive-deck-1/"></a>
  <nav class="brand-nav">
    <a href="/microcaptive-deck-1/">Home</a>
    <span class="sep">·</span>
    <span class="current">FAQ</span>
    <span class="sep">·</span>
    <a href="/microcaptive-deck-1/case-studies">Case Studies</a>
    <span class="sep">·</span>
    <a href="/microcaptive-deck-1/contact">Contact</a>
  </nav>
</header>

<!-- ── Slide pane (row 2) — internal scroll for utility content ────── -->
<div class="slide-pane">

<!-- ── Hero ────────────────────────────────────────────────────────── -->
<section class="hero">
  <h1>Common questions.</h1>
  <p class="lede">What smart business owners are asking.</p>
  <p class="helper">Tap a category to open it. Tap a question to see the answer.</p>
  <div class="scroll-cue">scroll for more <span class="arrow">&darr;</span></div>
</section>

<!-- ── Categories rendered by JS ───────────────────────────────────── -->
<div id="categories" class="category-wrap"></div>

</div><!-- /.slide-pane -->

<!-- ── Footer ──────────────────────────────────────────────────────── -->

/* ── Render ──────────────────────────────────────────────────────── */
function renderCategories() {
  const root = document.getElementById('categories');
  CATEGORIES.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'category-row';

    const head = document.createElement('button');
    head.className = 'category-head';
    head.type = 'button';
    head.setAttribute('aria-expanded', 'false');
    head.innerHTML = `
      <span class="c-num">${escapeHTML(cat.num)}</span>
      <span class="c-title">${escapeHTML(cat.title)}</span>
      <span class="c-rule"></span>
      <span class="c-icon" aria-hidden="true">+</span>
    `;

    const body = document.createElement('div');
    body.className = 'category-body';

    const list = document.createElement('div');
    list.className = 'faq-list';
    cat.questions.forEach(q => {
      const qrow = document.createElement('div');
      qrow.className = 'faq-row';
      qrow.innerHTML = `
        <button class="faq-q" type="button" aria-expanded="false">
          <span class="faq-q-text">${escapeHTML(q.q)}</span>
          <span class="faq-q-icon" aria-hidden="true">+</span>
        </button>
        <div class="faq-a">
          <div class="faq-a-body">${q.a.map(p => `<p>${p}</p>`).join('')}</div>
        </div>
      `;
      const btn = qrow.querySelector('.faq-q');
      btn.addEventListener('click', () => toggleQuestion(qrow, btn));
      list.appendChild(qrow);
    });
    body.appendChild(list);

    head.addEventListener('click', () => toggleCategory(row, head, body));

    row.appendChild(head);
    row.appendChild(body);
    root.appendChild(row);
  });
}

function toggleCategory(row, btn, body) {
  const isOpen = row.classList.toggle('open');
  btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  btn.querySelector('.c-icon').textContent = isOpen ? '–' : '+';

  if (isOpen) {
    body.style.maxHeight = body.scrollHeight + 'px';
    body.addEventListener('transitionend', function handler() {
      if (row.classList.contains('open')) {
        body.style.maxHeight = 'none';
      }
      body.removeEventListener('transitionend', handler);
    });
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(() => {
      body.style.maxHeight = '0';
    });
  }
}

function toggleQuestion(row, btn) {
  const isOpen = row.classList.toggle('open');
  btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  btn.querySelector('.faq-q-icon').textContent = isOpen ? '–' : '+';
}

/* ── Helpers ─────────────────────────────────────────────────────── */
function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ── Boot ────────────────────────────────────────────────────────── */
renderCategories();
